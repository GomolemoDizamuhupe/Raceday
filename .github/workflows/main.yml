name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore Part2_Raceday.sln

      - run: dotnet build Part2_Raceday.sln --no-restore --configuration Release

      - name: Start LocalDB and create the database
        run: |
          SqlLocalDB start MSSQLLocalDB
          sqlcmd -S "(localdb)\MSSQLLocalDB" -b -i "Race_day.sql"

      - run: dotnet test Part2_Raceday.sln --no-build --configuration Release
